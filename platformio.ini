; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Run "pio run" to automatically update compile_commands.json for current environment
; Or for specific env: "pio run -e macruwu3" or "pio run -e typeuwu2"
; Note: The post_build hook does not work for environment changes.
; Use the helper script or manual command to regenerate compile_commands.json.

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 133000000L
board_build.arduino.earlephilhower.usb_manufacturer = FGLabs
board_build.variants_dir = variants         ; Sets variants directory to the project local variants folder
build_flags =
    -DUSE_TINYUSB
    -DFAT12_SUPPORT=1
    -DIS_MCU_VERSION=1
    ; Explicit application MSC command/barrier adapters; no library patches.
    -Wl,--wrap=tud_msc_scsi_cb
    -Wl,--wrap=usbd_edpt_xfer
    -fpermissive
check_tool = clangtidy
check_flags = clangtidy: --config-file=.clang-tidy
check_src_filters = /home/desk/.platformio/packages/toolchain-rp2040-earlephilhower/arm-none-eabi/include/c++/14.3.0

; MSC linker reservation, not LittleFS. EEPROM remains outside this region.
; Migration required: disk starts 4 KiB earlier than the old implementation.
board_build.filesystem_size = 1m

; Pre-build script to initialize/update UWU-Lib submodule
extra_scripts =
    pre:pre_setup_uwu_lib.py

lib_deps =
    ; Pin the released archive: native async MSC, no local library patches.
    https://github.com/adafruit/Adafruit_TinyUSB_Arduino/archive/refs/tags/3.7.7.zip
    UWU-Lib=symlink://lib/UWU-Lib
	fortyseveneffects/MIDI Library@^5.0.2
    adafruit/Adafruit NeoPixel@^1.15.4
    adafruit/Adafruit GFX Library
    https://github.com/SirBramble/AnimatedGIF.git

[env:macruwu3]
board = RP_Moduluwu
build_flags =
    ${env.build_flags}
    -DMACRUWU_VERSION=3
    -DUSB_PRODUCT_ID=\"Macruwu\"
    -DUSB_PRODUCT_VERSION=\"3.0\"
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
    -DRP2350_PSRAM_CS=8
    -DMODULUWU_VERSION=2
board_build.arduino.earlephilhower.usb_product = Macruwu3

[env:typeuwu2]
board = RP_Moduluwu
build_flags =
    ${env.build_flags}
    -DTYPEUWU_VERSION=2
    -DUSB_PRODUCT_ID=\"Typeuwu\"
    -DUSB_PRODUCT_VERSION=\"2.0\"
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
    -DRP2350_PSRAM_CS=8
    -DMODULUWU_VERSION=2
board_build.arduino.earlephilhower.usb_product = Typeuwu2