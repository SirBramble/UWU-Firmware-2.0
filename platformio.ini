; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Run "pio run" to automatically update compile_commands.json for current environment
; Or for specific env: "pio run -e macruwu3" or "pio run -e typeuwu2"
; Note: The post_build hook does not work for environment changes.
; Use the helper script or manual command to regenerate compile_commands.json.

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 133000000L
board_build.arduino.earlephilhower.usb_manufacturer = FGLabs
board_build.variants_dir = variants         ; Sets variants directory to the project local variants folder
build_flags =
    -DUSE_TINYUSB
    -DFAT12_SUPPORT=1
    -DIS_MCU_VERSION=1
    -fpermissive
check_tool = clangtidy
check_flags = clangtidy: --config-file=.clang-tidy
check_src_filters = /home/desk/.platformio/packages/toolchain-rp2040-earlephilhower/arm-none-eabi/include/c++/14.3.0

; IMPORTANT: avoid PlatformIO auto-LittleFS partition unless you actually want it
; (simplest for MSC-on-flash is: no Arduino FS partition)
board_build.filesystem_size = 0m

lib_deps =
    https://github.com/SirBramble/UWU-Lib.git
	fortyseveneffects/MIDI Library@^5.0.2
    adafruit/Adafruit NeoPixel@^1.15.4
    adafruit/Adafruit GFX Library
    https://github.com/SirBramble/AnimatedGIF.git

[env:macruwu3]
board = RP_Moduluwu
build_flags =
    ${env.build_flags}
    -DDISK_SIZE_MB=1
    -DMACRUWU_VERSION=3
    -DUSB_PRODUCT_ID=\"Macruwu\"
    -DUSB_PRODUCT_VERSION=\"3.0\"
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
    -DRP2350_PSRAM_CS=8
    -DMODULUWU_VERSION=2
board_build.arduino.earlephilhower.usb_product = Macruwu3

[env:typeuwu2]
board = RP_Moduluwu
build_flags =
    ${env.build_flags}
    -DDISK_SIZE_MB=1
    -DTYPEUWU_VERSION=2
    -DUSB_PRODUCT_ID=\"Typeuwu\"
    -DUSB_PRODUCT_VERSION=\"2.0\"
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
    -DRP2350_PSRAM_CS=8
    -DMODULUWU_VERSION=2
board_build.arduino.earlephilhower.usb_product = Typeuwu2